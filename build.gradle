plugins {
    id 'java-library'
    id 'maven-publish'
}

version = '1.0'
group = 'no.statkart.matrikkel.transform'

repositories {
    mavenLocal()
    maven {
        url 'https://nexus.statkart.no/repository/public/'
    }
}

dependencies {
    api 'org.apache.commons:commons-math3:3.6.1'

    implementation 'com.google.guava:guava:28.0-jre'
    implementation 'org.slf4j:slf4j-api:1.8.0-beta4'
    implementation 'org.slf4j:slf4j-simple:1.8.0-beta4'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.assertj:assertj-core:3.14.0'
}

jar {
    into('lib') {
        from('lib')
    }
    into('transformation_init') {
        from('transformation_init')
    }
}

test {
    dependsOn jar
    classpath += files(jar.getArchiveFile())
}

publishing {
    publications {
        transform(MavenPublication) {
            from components.java
        }
    }
    repositories {
        String mavenUpload = System.getenv('MAVEN_PUBLISH')
        maven {
            if (mavenUpload) {
                String creds = mavenUpload.split('@|//').getAt(1)
                url mavenUpload.replace(creds.concat('@'), '') // url kommer i konsoll - ikke ha credentials der
                credentials {
                    username creds.split(':').getAt(0) ?: ""
                    password creds.split(':').getAt(1) ?: ""
                }
            }
        }
    }
}
