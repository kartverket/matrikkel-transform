plugins {
    id 'java-library'
    id 'maven-publish'
}

version = System.getProperty('version', 'SNAPSHOT')
group = 'no.statkart.matrikkel.transform'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.18'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.1.0-alpha1'
}

jar {
    into('lib') {
        from('lib')
    }
    into('transformation_init') {
        from('transformation_init')
    }
}

test {
    classpath += files(jar)
}

publishing {
    publications {
        transform(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/kartverket/matrikkel-transform"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
