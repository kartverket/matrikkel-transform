name: Build and Test

on:
  push:
    branches:
      - 'develop'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAJOR_VERSION: 1

jobs:
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-string.outputs.version }}
      should_tag_and_deploy: ${{ steps.version-string.outputs.should_tag_and_deploy }}

    steps:
      - name: Generate version string
        id: version-string
        shell: bash
        run: |
          version="${{ env.MAJOR_VERSION }}.$(date -u '+%Y.%m.%d-%H.%M')-$(echo "${GITHUB_SHA}" | cut -c1-7)"

          if [[ ${{github.event_name}} == 'push' ]]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "should_tag_and_deploy=true" >> $GITHUB_OUTPUT
          elif [[ ${{github.event_name}} == 'workflow_dispatch' ]]; then
            echo "version=${version}-wd" >> "$GITHUB_OUTPUT"
            echo "should_tag_and_deploy=true" >> $GITHUB_OUTPUT
          elif [[ ${{github.event_name}} == 'pull_request' ]]; then
            echo "version=${version}-pr" >> "$GITHUB_OUTPUT"
            echo "should_tag_and_deploy=false" >> $GITHUB_OUTPUT 
          else
            echo "Kunne ikke finne ut hva slags bygg som er ment (burde aldri skje)"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - calculate-version

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build
        run: ./gradlew clean assemble --no-daemon --refresh-dependencies --stacktrace -Dversion=${{ needs.calculate-version.outputs.version }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Run tests
        run: ./gradlew test --continue --no-daemon --stacktrace

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: '**/build/test-results/test/*.xml'
          check_name: Test rapport
          annotate_only: true
          detailed_summary: true

  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs:
      - test
      - calculate-version
    if: ${{ needs.calculate-version.outputs.should_tag_and_deploy == 'true' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Publish to GitHub Packages
        run: ./gradlew publish --no-daemon --stacktrace -Dversion=${{ needs.calculate-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
